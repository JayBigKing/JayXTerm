name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [main, MagnificoChen]
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        shell: pwsh
        run: ./scripts/windows.ps1 install
      - name: SSH and storage tests
        shell: pwsh
        run: ./scripts/windows.ps1 test
      - name: Windows application smoke test
        shell: pwsh
        env:
          JAYXTERM_LOCAL_DRAG_QA: '1'
          JAYXTERM_WORKSPACE_QA: '1'
          JAYXTERM_SESSION_EXCHANGE_QA: '1'
          JAYXTERM_SETTINGS_QA: '1'
          JAYXTERM_FEATURES_QA: '1'
          JAYXTERM_ASSIST_QA: '1'
        run: |
          ./scripts/windows.ps1 smoke
      - name: Package Windows x64
        shell: pwsh
        run: ./scripts/windows.ps1 package
      - name: Verify native drag data object
        run: node scripts/native-drag-check.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: JayXTerm-Windows-x64
          path: .codex-cache/releases/*.exe
